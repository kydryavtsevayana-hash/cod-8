<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Маршрут КОД-8</title>
  <desc id="desc">Маршрут от архива A-08 через шесть учебных секторов к центральному ядру</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#173b57" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173b57" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="900" height="360" rx="28" fill="#fbf7ee"/>
  <rect width="900" height="360" rx="28" fill="url(#grid)"/>

  <!-- route backbone -->
  <path d="M122 180H780" fill="none" stroke="#173b57" stroke-width="3" opacity=".82"/>
  <path d="M205 180V108H296V252H387V108H478V252H569V108H660V252H735V180" fill="none" stroke="#173b57" stroke-width="3" stroke-linejoin="round" opacity=".82"/>

  <!-- archive -->
  <g filter="url(#shadow)">
    <rect x="44" y="135" width="112" height="90" rx="18" fill="#173b57"/>
    <text x="100" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fffaf0">АРХИВ</text>
    <text x="100" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#f2a65a">A-08</text>
  </g>

  <!-- sector cards -->
  <g fill="#fffaf0" stroke="#2d7f86" stroke-width="3" filter="url(#shadow)">
    <rect x="170" y="70" width="70" height="70" rx="17"/>
    <rect x="261" y="218" width="70" height="70" rx="17"/>
    <rect x="352" y="70" width="70" height="70" rx="17"/>
    <rect x="443" y="218" width="70" height="70" rx="17"/>
    <rect x="534" y="70" width="70" height="70" rx="17"/>
    <rect x="625" y="218" width="70" height="70" rx="17"/>
  </g>
  <g fill="#173b57" font-family="Arial, sans-serif" text-anchor="middle" font-size="18" font-weight="700">
    <text x="205" y="112">01</text>
    <text x="296" y="260">02</text>
    <text x="387" y="112">03</text>
    <text x="478" y="260">04</text>
    <text x="569" y="112">05</text>
    <text x="660" y="260">06</text>
  </g>

  <!-- checkpoints -->
  <g fill="#f05d3a">
    <circle cx="205" cy="180" r="6"/><circle cx="296" cy="180" r="6"/><circle cx="387" cy="180" r="6"/>
    <circle cx="478" cy="180" r="6"/><circle cx="569" cy="180" r="6"/><circle cx="660" cy="180" r="6"/><circle cx="735" cy="180" r="6"/>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="735" y="125" width="118" height="110" rx="24" fill="#fffaf0" stroke="#2d7f86" stroke-width="3"/>
    <circle cx="794" cy="159" r="9" fill="#f05d3a"/>
    <text x="794" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173b57">CORE</text>
    <text x="794" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#71808a">RESTART</text>
  </g>

  <path d="M48 324H852" stroke="#f05d3a" stroke-width="4" stroke-dasharray="9 11" opacity=".55"/>
  <text x="48" y="310" font-family="Consolas, monospace" font-size="10" fill="#71808a" letter-spacing="1.2">RECOVERY ROUTE // SECTORS 01—06</text>
</svg>
